[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralrnn"
version = "0.3.5"
description = "A unified framework for implementing RNN methods in cognitive neuroscience"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Honghua Chen", email = "honghuachen69@gmail.com" }]
keywords = ["RNN", "computational-neuroscience", "dynamical-systems",
            "dynamics-reconstruction", "interpretability", "PLRNN"]

dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",        
    "safetensors>=0.4",   
    "neurogym>=0.0.1",
    "gym>=0.21",
    "matplotlib>=3.6",
    "jupyter",
    "ipykernel",
    "tqdm",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


[project.urls]
Homepage = "https://github.com/HHChen730/NeuralRNN"
Documentation = "https://neuralrnn.readthedocs.io/"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralrnn"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.setuptools.exclude-package-data]
"neuralrnn" = ["docs/*", "notebook/*", "*.ipynb"]
