[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralrnn"
version = "0.5.0"
description = "A unified framework for implementing RNN methods in cognitive neuroscience"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "Honghua Chen", email = "honghuachen69@gmail.com" }]
keywords = ["RNN", "computational-neuroscience", "dynamical-systems",
            "dynamics-reconstruction", "interpretability", "PLRNN"]

dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "safetensors>=0.4",
    "neurogym>=0.0.1",
    "gymnasium>=0.29",
    "matplotlib>=3.6",
    "jupyter",
    "ipykernel",
    "tqdm",
]

classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ChenHH730/NeuralRNN"
Documentation = "https://neuralrnn.readthedocs.io/"

[tool.hatch.build]
exclude = [
    "**/docs/**",
    "**/notebook/**",
    "**/notebooks/**",
    "*.ipynb",
    "/src/neuralrnn/rl/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuralrnn"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/test",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["test"]
